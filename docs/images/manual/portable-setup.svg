<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" role="img" aria-labelledby="title desc" xml:lang="ko">
  <title id="title">포터블 ZIP 설치</title>
  <desc id="desc">ZIP에서 모두 압축 풀기를 선택한다. 풀린 폴더 안의 VideoDownloader.exe를 실행하고, Chrome 연결 시 같은 폴더의 extension을 선택한다.</desc>
  <style>
    text { font-family: "Malgun Gothic", "Noto Sans KR", sans-serif; fill: #edf3ff; }
    .title { font-size: 26px; font-weight: 700; }
    .label { font-size: 17px; font-weight: 700; }
    .small { font-size: 15px; fill: #b5c4da; }
    .accent { fill: #a9caff; }
  </style>
  <rect x="1" y="1" width="898" height="338" rx="20" fill="#10141c" stroke="#354357"/>
  <text x="28" y="47" class="title">포터블 ZIP 설치</text>
  <text x="28" y="76" class="small">ZIP을 푼 뒤 같은 폴더에서 실행 파일과 Chrome 확장을 찾습니다.</text>

  <rect x="28" y="100" width="329" height="211" rx="12" fill="#171e29" stroke="#354357"/>
  <text x="48" y="132" class="label"><tspan class="accent">01</tspan><tspan dx="12">ZIP 전체 풀기</tspan></text>
  <path d="M52 158h30l10 10v46H52z M82 158v10h10 M67 161v28m0 5v5" fill="none" stroke="#a9caff" stroke-width="2" stroke-linejoin="round"/>
  <text x="108" y="178" class="small">VideoDownloaderPortable-</text>
  <text x="108" y="201" class="small">win-x64.zip</text>
  <rect x="48" y="233" width="289" height="49" rx="7" fill="#263852"/>
  <text x="192.5" y="264" class="label" text-anchor="middle">우클릭 → 모두 압축 풀기</text>
  <path d="M372 204h34m-9-9 9 9-9 9" fill="none" stroke="#a9caff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="423" y="100" width="449" height="211" rx="12" fill="#171e29" stroke="#354357"/>
  <text x="443" y="132" class="label"><tspan class="accent">02</tspan><tspan dx="12">풀린 폴더 열기</tspan></text>
  <text x="443" y="160" class="small">VideoDownloaderPortable</text>
  <rect x="443" y="173" width="409" height="33" rx="5" fill="#263852"/>
  <text x="455" y="195" class="label">VideoDownloader.exe</text>
  <text x="837" y="195" text-anchor="end" class="small accent">실행</text>
  <text x="455" y="226" class="small">VideoNativeHost.exe</text>
  <text x="455" y="251" class="small">tools/</text>
  <text x="455" y="281" class="label">extension/</text>
  <text x="837" y="281" text-anchor="end" class="small accent">Chrome에서 선택</text>
</svg>
